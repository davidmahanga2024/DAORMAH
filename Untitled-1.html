<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safari Soles Header</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background:#f5f5f5;
}

/* Header */
header{
    background:#fff;
    height:90px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 60px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

/* Logo Section */
.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo img{
    width:55px;
}

.logo h2{
    font-size:20px;
    color:#3d1d16;
    font-weight:bold;
    text-transform:uppercase;
}

/* Navigation */
nav ul{
    display:flex;
    list-style:none;
    gap:60px;
}

nav ul li a{
    text-decoration:none;
    color:#222;
    font-size:18px;
    font-weight:500;
    transition:0.3s;
}

nav ul li a:hover{
    color:#8b5e3c;
}

/* Mobile */
@media(max-width:768px){

    header{
        flex-direction:column;
        height:auto;
        padding:20px;
    }

    nav ul{
        gap:20px;
        flex-wrap:wrap;
        justify-content:center;
        margin-top:15px;
    }
}
</style>
</head>
<header>

    <div class="logo">
        <!-- Replace logo.png with your logo -->

    </div>

    <nav>
        <ul>
            <li><a href="#">Safari soles</a></li>
            <li><a href="#">The big five</a></li>
            <li><a href="#">About Us</a></li>
        </ul>
    </nav>

</header>
